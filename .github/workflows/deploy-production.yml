# Production deploy caller (TASK-014) — every merge to `main` (i.e. the
# evergreen `staging` -> `main` promotion PR) deploys the production
# Cloudflare account (REQ-003). Branch protection on `main` + the
# `production` environment's required-reviewer rule enforce REQ-004/SEC-003:
# the only way for a commit to reach `main` is the promotion PR, and the
# deploy job pauses for reviewer approval before running.

name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to production
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
