# PR validation — required status check for merges.
# Deploy workflows intentionally do NOT run on pull requests: `Deploy Staging`
# fires only on pushes to `staging` (post-merge), and a deploy of the merge
# commit cannot precede the merge it would gate. This workflow provides the
# pre-merge blocker: typecheck + tests on every PR.
name: PR Checks

on:
  pull_request:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # Assignment-worker integration tests (TEST-006) run the real cleanup
    # consumer against live Postgres seeded from database/migrations. Skipped
    # gracefully when the service is unavailable, so tests stay green locally.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assignment_reader_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # TEST-006/TEST-002: worker integration tests + migration boundary
      # verification against the seeded service database. DATABASE_URL seeds
      # the schema; AR_TEST_DATABASE_URL gates the vitest integration suite.
      - name: Seed Postgres schema
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/assignment_reader_ci
        run: sh scripts/migrate.sh

      - name: Migration boundary verification
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/assignment_reader_ci
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/assignment-reader-migration-verify.sql 2>&1 | tee /dev/stderr | grep -q BOUNDARY_VERIFICATION_PASSED

      - name: Test
        env:
          AR_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/assignment_reader_ci
        run: pnpm test
